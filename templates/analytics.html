{% extends "base.html" %}
{% block title %}Аналитика — SkillNavigator{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="/profile" class="btn btn-outline-secondary btn-sm me-3"><i class="bi bi-arrow-left me-1"></i>Назад</a>
  <h4 class="fw-bold mb-0"><i class="bi bi-bar-chart me-2"></i>Аналитика</h4>
</div>

<div class="row g-4">
  <!-- Funnel -->
  <div class="col-lg-5">
    <div class="card h-100">
      <div class="card-body">
        <h6 class="fw-bold mb-1"><i class="bi bi-funnel me-2 text-primary"></i>Воронка откликов</h6>
        <div id="funnel-stats" class="text-muted small mb-3"></div>
        <canvas id="funnelChart" height="260"></canvas>
      </div>
    </div>
  </div>

  <!-- Top skills -->
  <div class="col-lg-7">
    <div class="card h-100">
      <div class="card-body">
        <h6 class="fw-bold mb-3"><i class="bi bi-trophy me-2 text-warning"></i>Топ-10 востребованных навыков</h6>
        <canvas id="skillsChart" height="260"></canvas>
      </div>
    </div>
  </div>

  <!-- Vacancy dynamics -->
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-bold mb-0"><i class="bi bi-graph-up me-2 text-success"></i>Динамика рынка вакансий</h6>
          <select id="days-select" class="form-select form-select-sm" style="width:auto" onchange="loadDynamics()">
            <option value="7">7 дней</option>
            <option value="30" selected>30 дней</option>
            <option value="90">90 дней</option>
          </select>
        </div>
        <canvas id="dynamicsChart" height="120"></canvas>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const user = getUser();
if (!user) window.location.href = '/login';

const STATUS_LABELS = {
  applied: 'Отправлен', vcv: 'VCV', test_task: 'Тестовое',
  interview: 'Интервью', offer: 'Оффер', rejected: 'Отказ'
};
const STATUS_COLORS = {
  applied: '#6c757d', vcv: '#0dcaf0', test_task: '#ffc107',
  interview: '#0d6efd', offer: '#198754', rejected: '#dc3545'
};

let funnelChart, skillsChart, dynamicsChart;

async function loadFunnel() {
  const res = await apiFetch('/analytics/funnel');
  if (!res || !res.ok) return;
  const d = await res.json();

  const info = `Всего: <strong>${d.total}</strong>  |  Среднее ожидание: <strong>${d.avg_days_to_response ?? '—'} дн.</strong>`;
  document.getElementById('funnel-stats').innerHTML = info;

  const labels = d.funnel.map(f => STATUS_LABELS[f.status] || f.status);
  const counts = d.funnel.map(f => f.count);
  const colors = d.funnel.map(f => STATUS_COLORS[f.status] || '#adb5bd');

  if (funnelChart) funnelChart.destroy();
  funnelChart = new Chart(document.getElementById('funnelChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: counts, backgroundColor: colors, borderWidth: 2 }] },
    options: { plugins: { legend: { position: 'bottom' } }, cutout: '55%' }
  });
}

async function loadTopSkills() {
  const res = await apiFetch('/analytics/top-skills?limit=10');
  if (!res || !res.ok) return;
  const skills = await res.json();
  if (!skills.length) return;

  const labels = skills.map(s => s.name);
  const counts = skills.map(s => s.count);

  if (skillsChart) skillsChart.destroy();
  skillsChart = new Chart(document.getElementById('skillsChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Вакансий',
        data: counts,
        backgroundColor: 'rgba(13,110,253,.7)',
        borderRadius: 4,
      }]
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { precision: 0 } } }
    }
  });
}

async function loadDynamics() {
  const days = document.getElementById('days-select').value;
  const res = await apiFetch(`/analytics/vacancy-dynamics?days=${days}`);
  if (!res || !res.ok) return;
  const data = await res.json();

  const labels = data.map(d => d.date);
  const counts = data.map(d => d.count);

  if (dynamicsChart) dynamicsChart.destroy();
  dynamicsChart = new Chart(document.getElementById('dynamicsChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Новых вакансий',
        data: counts,
        borderColor: '#198754',
        backgroundColor: 'rgba(25,135,84,.1)',
        fill: true,
        tension: 0.3,
        pointRadius: 3,
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
    }
  });
}

loadFunnel();
loadTopSkills();
loadDynamics();
</script>
{% endblock %}
