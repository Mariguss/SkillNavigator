{% extends "base.html" %}
{% block title %}Мои отклики — SkillNavigator{% endblock %}

{% block content %}
<h4 class="mb-4 fw-bold"><i class="bi bi-list-check me-2"></i>Мои отклики</h4>

<div class="row g-4">
  <!-- Sidebar filters -->
  <div class="col-lg-3">
    <div class="card p-3">
      <h6 class="fw-bold mb-3"><i class="bi bi-funnel me-1"></i>Фильтры</h6>
      <div class="mb-3">
        <label class="form-label small fw-semibold">По статусу</label>
        <select id="filter-status" class="form-select form-select-sm" onchange="loadApps()">
          <option value="">Все статусы</option>
          <option value="applied">Отправлен</option>
          <option value="vcv">VCV</option>
          <option value="test_task">Тестовое задание</option>
          <option value="interview">Интервью</option>
          <option value="offer">Оффер</option>
          <option value="rejected">Отказ</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Сортировка</label>
        <select id="filter-order" class="form-select form-select-sm" onchange="loadApps()">
          <option value="-id">Новые сначала</option>
          <option value="id">Старые сначала</option>
        </select>
      </div>
    </div>
  </div>

  <!-- List -->
  <div class="col-lg-9">
    <div class="mb-3">
      <input id="search-input" class="form-control" placeholder="Поиск по названию вакансии…" oninput="debounce()"/>
    </div>
    <div id="app-list"></div>
    <div id="pagination" class="d-flex gap-2 justify-content-center mt-3"></div>
  </div>
</div>

<!-- Edit status modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Редактировать отклик</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id"/>
        <div class="mb-3">
          <label class="form-label">Статус</label>
          <select id="edit-status" class="form-select">
            <option value="applied">Отправлен</option>
            <option value="vcv">VCV</option>
            <option value="test_task">Тестовое задание</option>
            <option value="interview">Интервью</option>
            <option value="offer">Оффер</option>
            <option value="rejected">Отказ</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Заметки</label>
          <textarea id="edit-notes" class="form-control" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger me-auto" onclick="deleteApp()">Удалить</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" onclick="saveApp()">Сохранить</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const user = getUser();
if (!user) window.location.href = '/login';

let currentPage = 1, searchTimer = null;

const STATUS_LABELS = {
  applied: ['Отправлен', 'secondary'],
  vcv: ['VCV', 'info'],
  test_task: ['Тестовое', 'warning'],
  interview: ['Интервью', 'primary'],
  offer: ['Оффер', 'success'],
  rejected: ['Отказ', 'danger'],
};

function debounce() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadApps(), 400);
}

async function loadApps(page = 1) {
  currentPage = page;
  const status = document.getElementById('filter-status').value;
  const order = document.getElementById('filter-order').value;
  let params = `user_id__eq=${user.id}&page=${page}&page_size=10&ordering=${order}`;
  if (status) params += `&status__eq=${status}`;

  const res = await apiFetch(`/application?${params}`);
  if (!res) return;
  const data = await res.json();

  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const filtered = q
    ? (data.founds||[]).filter(a => (a.backup_vacancy_name||'').toLowerCase().includes(q))
    : data.founds || [];

  renderApps(filtered);
  renderPagination(data.search_options);
}

function renderApps(list) {
  const el = document.getElementById('app-list');
  if (!list.length) {
    el.innerHTML = '<div class="text-center text-muted py-5"><i class="bi bi-inbox fs-2"></i><p class="mt-2">Откликов пока нет</p></div>';
    return;
  }
  el.innerHTML = list.map(a => {
    const [label, color] = STATUS_LABELS[a.status] || [a.status, 'secondary'];
    const created = new Date(a.created_at);
    const days = Math.floor((Date.now() - created) / 86400000);
    return `
    <div class="card mb-2">
      <div class="card-body py-2 d-flex align-items-start gap-3">
        <div class="flex-grow-1">
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="fw-semibold">${escHtml(a.backup_vacancy_name || 'Вакансия #' + a.vacancy_id)}</span>
            <span class="badge bg-${color}">${label}</span>
            <small class="text-muted"><i class="bi bi-clock me-1"></i>${days} д. назад</small>
          </div>
          ${a.notes ? `<p class="text-muted small mb-0 mt-1">${escHtml(a.notes)}</p>` : ''}
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="openEdit(${a.id},'${escHtml(a.status)}',\`${escHtml(a.notes||'')}\`)">
          <i class="bi bi-pencil"></i>
        </button>
      </div>
    </div>`;
  }).join('');
}

function openEdit(id, status, notes) {
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-status').value = status;
  document.getElementById('edit-notes').value = notes;
  new bootstrap.Modal(document.getElementById('editModal')).show();
}

async function saveApp() {
  const id = document.getElementById('edit-id').value;
  const status = document.getElementById('edit-status').value;
  const notes = document.getElementById('edit-notes').value;
  const res = await apiFetch(`/application/${id}`, {
    method: 'PATCH',
    body: JSON.stringify({ status, notes })
  });
  if (res && res.ok) {
    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    showToast('Статус обновлён');
    loadApps(currentPage);
  }
}

async function deleteApp() {
  if (!confirm('Удалить отклик?')) return;
  const id = document.getElementById('edit-id').value;
  const res = await apiFetch(`/application/${id}`, { method: 'DELETE' });
  if (res && (res.ok || res.status === 204)) {
    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    showToast('Отклик удалён', 'warning');
    loadApps(currentPage);
  }
}

function renderPagination(opts) {
  if (!opts) return;
  const pages = Math.ceil(opts.total_count / opts.page_size);
  const el = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML = ''; return; }
  let html = '';
  for (let i = 1; i <= pages; i++) {
    html += `<button class="btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-secondary'}" onclick="loadApps(${i})">${i}</button>`;
  }
  el.innerHTML = html;
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadApps();
</script>
{% endblock %}
